<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromaWrite AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    header h1 { margin: 0; font-size: 1.8rem; color: #a5b4fc; }
    header p { margin: 0.5rem 0 0; color: #94a3b8; }
    
    .editor-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }
    textarea:focus { outline: 2px solid var(--accent); }
    
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-badge {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    
    .preview-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      min-height: 140px;
      line-height: 1.8;
      font-size: 1.1rem;
      white-space: pre-wrap;
    }
    
    .word-tag {
      padding: 0.15em 0.35em;
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
    }
    .emotion-sentence {
      padding: 0.2em 0.4em;
      border-radius: 6px;
      margin: 0 0.1em;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ChromaWrite AI</h1>
    <p>Secure Backend Architecture & Contextual Highlighting</p>
  </header>

  <div class="editor-box">
    <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
    <div class="controls">
      <button class="btn" id="analyzeBtn" onclick="runAIAnalysis()">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Analyze with AI</span>
      </button>
      <div class="status-badge" id="statusBadge">Ready for secure server processing</div>
    </div>
  </div>

  <h3>Rendered Preview</h3>
  <div id="outputPreview" class="preview-box">
    <em>Your processed text will appear here...</em>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
